# Coolify deployment (Docker Compose build pack).
#
# Differences from docker-compose.yml:
# - no env_file (api/.env, app/.env are not in the repo); all config comes
#   from Coolify environment variables
# - no published host ports; Coolify's proxy routes the domains:
#     web -> https://sp.schliesser.dev     (container port 3000)
#     api -> https://spapi.schliesser.dev  (container port 4000)
# - secrets are generated by Coolify (SERVICE_PASSWORD_*); INTERNAL_API_SECRET
#   uses the same magic variable in both services so the values match
# - NEXT_PUBLIC_* are build args: changing them needs a rebuild

services:
  mongo:
    image: mongo:7
    # Single-node replica set: better-auth and the services use transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the set on first run; healthy once this node is primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "var s; try { s = rs.status().myState } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(s === 1 ? 0 : 1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/sitepins?replicaSet=rs0
      BASE_URL: ${API_URL:-https://spapi.schliesser.dev}
      APP_URL: ${APP_URL:-https://sp.schliesser.dev}
      CORS_ORIGINS: ${APP_URL:-https://sp.schliesser.dev}
      TRUST_PROXY: "1"
      # web and api are on different subdomains: share the session cookie
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.schliesser.dev}

      BRAND_NAME: ${BRAND_NAME:-Sitepins}
      BRAND_URL: ${BRAND_URL:-https://sitepins.com}
      BRAND_SLUG: ${BRAND_SLUG:-sitepins}
      BRAND_SUPPORT_URL: ${BRAND_SUPPORT_URL:-https://sitepins.com/contact}
      GIT_APP_NAME: ${GIT_APP_NAME:-schliesser-sitepins}

      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_BETTERAUTH}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_TOKEN_EXPIRE: 7d
      INTERNAL_API_SECRET: ${SERVICE_PASSWORD_64_INTERNAL}
      SANDBOX_ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_SANDBOX}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.schliesser.dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-sitepins}
      S3_FORCE_PATH_STYLE: "true"

      MAIL_PROVIDER: ${MAIL_PROVIDER}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sitepins}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${API_URL:-https://spapi.schliesser.dev}/api/v1
        NEXT_PUBLIC_HP_WS_URL: ${API_WS_URL:-wss://spapi.schliesser.dev}/api/v1/editor/collab
        NEXT_PUBLIC_BUCKET_URL: ${BUCKET_PUBLIC_URL:-https://s3.schliesser.dev/sitepins}
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-Sitepins}
        NEXT_PUBLIC_BRAND_URL: ${BRAND_URL:-https://sitepins.com}
        NEXT_PUBLIC_GIT_APP_NAME: ${GIT_APP_NAME:-schliesser-sitepins}
        NEXT_PUBLIC_GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID}
        NEXT_PUBLIC_BRAND_SLUG: ${BRAND_SLUG:-sitepins}
        NEXT_PUBLIC_BRAND_LOGO: /images/logo.svg
        NEXT_PUBLIC_BRAND_LOGO_DARK: /images/logo-white.svg
        NEXT_PUBLIC_BRAND_LOGO_ICON: /images/logo-icon.svg
        NEXT_PUBLIC_BRAND_LOGO_WIDTH: "136"
        NEXT_PUBLIC_BRAND_LOGO_HEIGHT: "40"
        NEXT_PUBLIC_BRAND_FAVICON: /images/favicon.png
        NEXT_PUBLIC_TERMS_URL: https://sitepins.com/terms
        NEXT_PUBLIC_PRIVACY_URL: https://sitepins.com/privacy-policy
        NEXT_PUBLIC_SUPPORT_URL: https://sitepins.com/contact
        NEXT_PUBLIC_UPDATES_URL: https://updates.sitepins.com
        NEXT_PUBLIC_STATUS_URL: https://status.sitepins.com
        NEXT_PUBLIC_COMMUNITY_URL: https://discord.gg/KrpvHfqcNA
        NEXT_PUBLIC_DOCS_URL: https://docs.sitepins.com
        NEXT_PUBLIC_SOURCE_URL: https://github.com/schliesser/sitepins
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_SECRET: ${SERVICE_PASSWORD_64_INTERNAL}
      NEXT_PUBLIC_DASHBOARD_HOME: /dashboard/account
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL}
      AI_API_KEY: ${AI_API_KEY}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:
